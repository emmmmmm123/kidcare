<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>遛娃地图</title>

<!-- =========================================================
     百度地图 API
========================================================= -->
<script src="https://api.map.baidu.com/api?type=webgl&v=1.0&ak=o8LnSUIDI7AiJDfc9eRMNz3YDSdKHkRn&s=1"></script>

<style>
/* =========================================================
   全局
========================================================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --bg:#EAF6FF;
  --card:#FFFFFF;
  --primary:#FFE7A3;
  --primary-soft:#FFF0C2;
  --start:#62A8F5;
  --start-soft:#DDEEFF;
  --end:#62A8F5;
  --end-soft:#DDEEFF;
  --route:#62A8F5;
  --blue:#348FDA;
  --green:#63B26E;
  --orange:#F79256;
  --purple:#C38DDE;
  --text:#222222;
  --text2:#444444;
  --muted:#888888;
  --line:#EAE4D8;
}

html,
body{
  width:100%;
  height:100%;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "PingFang SC",
    "Helvetica Neue",
    Arial,
    sans-serif;
  background:var(--bg);
  color:var(--text);
}

#app{
  position:relative;
  width:100%;
  height:100vh;
  max-width:600px;
  margin:0 auto;
  overflow:hidden;
  background:var(--bg);
}

.page{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:none;
  flex-direction:column;
  background:var(--bg);
}

#page1{
  overflow-y:auto;
  overflow-x:hidden;
  scrollbar-width:none;
}

#page1::-webkit-scrollbar{
  display:none;
}

.page.active{
  display:flex;
}

button{ font-family:inherit; }

.primary-btn,
.start-btn,
.nav-start-btn{
  background:var(--primary)!important;
  color:var(--text)!important;
  border:1px solid var(--primary)!important;
}

.start-btn:active,
.nav-start-btn:active{
  transform:scale(.98);
}

/* =========================================================
   首页顶部
========================================================= */

.top-bar{
  flex-shrink:0;
  background:#fff;
  padding:12px 16px 12px;
  color:var(--text);
  border-radius:0 0 20px 20px;
  box-shadow:0 2px 10px rgba(80,60,30,.06);
  z-index:20;
}

.top-row{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:0;
  min-width:0;
}

.loc-wrap{
  display:flex;
  align-items:center;
  gap:7px;
  min-width:0;
  flex:1 1 auto;
  overflow:hidden;
}

.loc-pin{
  width:18px;
  height:22px;
  flex:0 0 18px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.loc-pin svg{
  width:18px;
  height:22px;
  display:block;
}

.loc-edit-input{
  border:none;
  outline:none;
  background:transparent;
  padding:0;
  width:16ch;
  max-width:16ch;
  min-width:0;
  flex:0 1 16ch;
  color:#333333;
  font-size:14px;
  font-weight:500;
  line-height:22px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.loc-edit-input::placeholder{ color:#777777; }

.locate-btn{
  width:24px;
  height:24px;
  border-radius:50%;
  background:#EAF4FF;
  color:#4096FF;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:14px;
  flex:0 0 24px;
  cursor:pointer;
}

.locate-btn:active{ transform:scale(.92); }

.weather-chip{
  height:40px;
  min-width:76px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  background:#FFF7EA;
  border-radius:20px;
  padding:0 10px;
  flex:0 0 auto;
}

.weather-icon{
  width:18px;
  height:18px;
  border-radius:50%;
  background:#FFD66B;
  box-shadow:0 0 0 3px #FFF0C2;
  flex:0 0 18px;
}

.weather-copy{
  display:flex;
  flex-direction:column;
  justify-content:center;
  line-height:1;
}

.weather-temp{
  font-size:16px;
  color:#222222;
  font-weight:700;
}

.weather-desc{
  margin-top:4px;
  font-size:12px;
  color:#666666;
}

.suggest-list{
  margin-top:8px;
  background:#fff;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 4px 10px rgba(0,0,0,.12);
  display:none;
}

.suggest-item{
  padding:9px 14px;
  font-size:13px;
  color:#555;
  border-bottom:1px solid #f5f5f5;
}

.suggest-item:last-child{ border-bottom:none; }
.suggest-item:active{ background:#F5F9FF; }

/* =========================================================
   Banner
========================================================= */

.banner-home{
  position:relative;
  flex-shrink:0;
  height:174px;
  margin:4px 16px 8px;
  padding:0;
  overflow:hidden;
  border-radius:0;
  background:transparent;
}

.home-banner-image{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
  object-position:center center;
}

.banner-title{
  position:relative;
  z-index:2;
  font-size:32px;
  line-height:1.18;
  font-weight:800;
  letter-spacing:-1px;
  color:#62A8F5;
}

.banner-subtitle{
  position:relative;
  z-index:2;
  margin-top:9px;
  font-size:16px;
  line-height:1.5;
  color:#62A8F5;
}

/* =========================================================
   首页内容
========================================================= */

.home-content{
  flex-shrink:0;
  padding:0 16px 24px;
}

#map1{
  width:calc(100% - 32px);
  height:220px;
  flex:0 0 220px;
  margin:0 16px 18px;
  border-radius:20px;
  overflow:hidden;
  background:#EAF4FF;
  box-shadow:0 2px 12px rgba(70,120,170,.10);
}

.home-card{
  background:#FFFFFF;
  border-radius:16px;
  padding:16px;
  margin-bottom:12px;
  box-shadow:0 2px 12px rgba(30,60,90,.05);
}

.home-card-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  margin-bottom:14px;
}

.home-card-title-wrap{ min-width:0; }

.home-title-line{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}

.memory-book-btn{
  border:0;
  background:transparent;
  border-radius:8px;
  width:32px;
  height:32px;
  padding:0;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  font-size:23px;
  box-shadow:none;
}

.memory-mask{
  position:fixed;inset:0;z-index:3000;background:rgba(43,65,88,.38);
  display:none;align-items:flex-end;justify-content:center;padding:14px;
}
.memory-mask.show{display:flex;}
.memory-panel{
  width:100%;max-width:520px;max-height:82vh;overflow:auto;background:#FFFDF7;
  border-radius:26px 26px 22px 22px;padding:20px 16px 24px;
  box-shadow:0 12px 40px rgba(30,50,80,.2);
  border:3px solid #FFF0C8;
}
.memory-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.memory-title{font-size:21px;font-weight:800;color:#473A2B;}
.memory-close{border:0;background:#F4E8D5;border-radius:50%;width:32px;height:32px;font-size:18px;color:#775F40;}
.memory-tabs{display:flex;gap:8px;margin-bottom:14px;}
.memory-tab{flex:1;border:0;border-radius:12px;padding:10px;background:#FFFFFF;color:#786B59;font-size:14px;font-weight:700;}
.memory-tab.active{background:#FFFFFF;color:#604B24;box-shadow:inset 0 -2px 0 #E8D8B8;}
.memory-list{display:flex;flex-direction:column;gap:9px;}
.memory-item{background:#FFFFFF;border:1px solid #F5E8CF;border-radius:16px;padding:12px;display:flex;gap:10px;align-items:center;}
.memory-item-emoji{width:38px;height:38px;border-radius:13px;background:#EAF4FF;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.memory-item-main{min-width:0;flex:1;}
.memory-item-name{font-size:14px;font-weight:800;color:#333;overflow-wrap:anywhere;}
.memory-item-meta{font-size:12px;color:#888;margin-top:4px;}
.memory-item-action{border:0;background:#FFF2F6;border-radius:12px;padding:7px 9px;color:#C66C8B;font-size:12px;white-space:nowrap;}
.memory-empty{text-align:center;padding:28px 12px;color:#9A8D7C;font-size:13px;background:#FFF8E9;border-radius:18px;}

.home-card-title{
  font-size:20px;
  line-height:1.25;
  font-weight:800;
  color:#222222;
}

.home-card-subtitle{
  margin-top:4px;
  font-size:13px;
  line-height:1.4;
  color:#777777;
}

.home-add{
  border:none;
  background:transparent;
  color:#4096FF;
  font-size:14px;
  line-height:22px;
  white-space:nowrap;
  cursor:pointer;
  padding:0;
}

/* =========================================================
   宝宝列表（3列，竖排卡片：头像上、名字下）
========================================================= */

.baby-list{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:8px;
}

@media (max-width:390px){
  .baby-list{ grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; }
}

.baby-card{
  position:relative;
  min-width:0;
  min-height:110px;
  padding:12px 8px 32px;
  border:1px solid #E9EDF2;
  border-radius:16px;
  background:#FFFFFF;
  cursor:pointer;
  transition:.18s ease;
}

.baby-card.pink{ background:#FFF2F6; border-color:#FFF2F6; }
.baby-card.green{ background:#F2FBF8; border-color:#F2FBF8; }

.baby-card.selected{
  border:1.5px solid #FFE7A3;
  background:#FFE7A3;
  box-shadow:0 2px 8px rgba(255,231,163,.24);
}

.baby-info-row{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:7px;
  min-width:0;
}

.baby-avatar{
  width:42px;
  height:42px;
  flex:0 0 42px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#E8F2FF;
  overflow:hidden;
}

.baby-avatar .baby-gender-icon{
  width:30px;
  height:30px;
  object-fit:contain;
  display:block;
}

.baby-card.pink .baby-avatar{ background:#FFE0EA; }
.baby-card.green .baby-avatar{ background:#DDF4EA; }

.baby-detail{
  min-width:0;
  width:100%;
  text-align:center;
}

.baby-name{
  display:block;
  font-size:15px;
  line-height:1.3;
  font-weight:800;
  color:#222222;
  white-space:normal;
  overflow:visible;
  text-overflow:clip;
  overflow-wrap:anywhere;
  word-break:break-word;
  letter-spacing:-.2px;
}

.baby-age{
  margin-top:4px;
  font-size:12px;
  line-height:1.2;
  color:#666666;
  white-space:normal;
}

.baby-edit-btn{
  position:absolute;
  top:6px;
  right:6px;
  width:20px;
  height:20px;
  padding:0;
  border:none;
  border-radius:50%;
  background:rgba(255,255,255,.72);
  color:#4096FF;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  z-index:2;
}

.baby-edit-btn svg{ width:12px; height:12px; }

.baby-delete-btn{
  position:absolute;
  right:6px;
  bottom:6px;
  width:18px;
  height:18px;
  padding:0;
  border:none;
  border-radius:50%;
  background:rgba(255,255,255,.78);
  color:#999999;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  z-index:2;
}

.baby-delete-btn svg{ width:11px; height:11px; }

@media(max-width:390px){
  .baby-card{ padding-left:5px; padding-right:5px; }
  .baby-name{ font-size:14px; }
}

/* =========================================================
   宝宝编辑弹窗
========================================================= */

.baby-modal-mask{
  position:fixed;
  inset:0;
  z-index:200;
  display:none;
  align-items:flex-end;
  justify-content:center;
  background:rgba(25,35,50,.34);
}

.baby-modal-mask.show{ display:flex; }

.baby-modal{
  width:min(100%,600px);
  background:#FFFFFF;
  border-radius:24px 24px 0 0;
  padding:20px 18px 24px;
  box-shadow:0 -8px 30px rgba(30,60,90,.12);
}

.baby-modal-title{
  font-size:20px;
  font-weight:800;
  color:#222222;
  text-align:center;
  margin-bottom:18px;
}

.baby-form-row{ margin-bottom:14px; }

.baby-form-label{
  display:block;
  margin-bottom:7px;
  font-size:13px;
  color:#666666;
}

.baby-form-input{
  width:100%;
  height:44px;
  border:1px solid #E6EAF0;
  border-radius:12px;
  outline:none;
  padding:0 12px;
  font-size:15px;
  color:#222222;
  background:#FAFBFD;
}

.baby-gender-options{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.baby-gender-option{
  height:52px;
  border:1px solid #E6EAF0;
  border-radius:14px;
  background:#FFFFFF;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  font-size:15px;
  color:#444444;
  cursor:pointer;
}

.baby-gender-option.selected.boy{
  border-color:#62A8F5;
  background:#EAF4FF;
  color:#348FDA;
}

.baby-gender-option.selected.girl{
  border-color:#E98BA8;
  background:#FFF2F6;
  color:#C66C8B;
}

.baby-gender-option svg{ width:28px; height:28px; }

.baby-gender-option .baby-gender-icon{
  width:28px;
  height:28px;
  object-fit:contain;
  display:block;
}

.baby-modal-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:18px;
}

.baby-modal-btn{
  height:44px;
  border-radius:22px;
  border:none;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.baby-modal-btn.cancel{ background:#F3F5F7; color:#666666; }
.baby-modal-btn.save{ background:#4096FF; color:#FFFFFF; }

/* =========================================================
   出行目的
========================================================= */

.purpose-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:10px 8px;
}

.purpose-item{
  min-width:0;
  border:none;
  background:transparent;
  padding:0;
  cursor:pointer;
  text-align:center;
}

.purpose-icon-box{
  width:54px;
  height:54px;
  margin:0 auto 6px;
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.purpose-icon-box.food{background:#FFF5E0;}
.purpose-icon-box.play{background:#E8F2FF;}
.purpose-icon-box.outdoor{background:#EDF9EF;}
.purpose-icon-box.shop{background:#FCEEF6;}
.purpose-icon-box.medical{background:#E8F2FF;}
.purpose-icon-box.culture{background:#FFF5E0;}
.purpose-icon-box.sport{background:#FFF0E8;}

.purpose-icon-box img{
  width:32px;
  height:32px;
  object-fit:contain;
}

.purpose-label{
  display:block;
  font-size:13px;
  line-height:1.3;
  color:#444444;
  white-space:nowrap;
}

.purpose-item.active .purpose-icon-box{
  background:#FFE7A3!important;
  box-shadow:inset 0 0 0 2px #FFE7A3;
}

.start-btn{
  width:100%;
  margin:4px 0 0;
  border:none!important;
  border-radius:24px!important;
  padding:13px 0;
  background:#FFE7A3!important;
  color:#222222!important;
  font-size:18px;
  line-height:24px;
  font-weight:700;
  box-shadow:0 6px 14px rgba(255,231,163,.28);
  cursor:pointer;
}

.start-btn:active{ transform:scale(.985); }

#map1{ width:100%; flex:1; min-height:0; }

/* 推荐卡片类型图标 */
.rec-name-row{
  display:flex;
  align-items:center;
  gap:7px;
  min-width:0;
}

.rec-type-icon{
  width:24px;
  height:24px;
  object-fit:contain;
  flex-shrink:0;
}

.rec-type-label{
  margin-left:2px;
  padding:2px 7px;
  border-radius:9px;
  background:#F5F8FA;
  color:#888;
  font-size:10px;
  font-weight:600;
  flex-shrink:0;
}

/* 地图圆点 */
.map-point-icon{
  width:20px;
  height:20px;
  border-radius:50%;
  position:relative;
  border:4px solid rgba(255,255,255,.95);
  box-shadow:0 2px 8px rgba(0,0,0,.20);
}
.map-point-icon.start{ background:var(--start); }
.map-point-icon.end{ background:var(--end); }
.map-point-icon.user{ background:#B7D9FF; }

.map-click-label{
  background:#fff!important;
  color:var(--text2)!important;
  border:1px solid var(--line)!important;
  border-radius:14px!important;
  padding:5px 9px!important;
  box-shadow:0 3px 10px rgba(50,40,20,.15)!important;
  font-size:12px!important;
  font-weight:700!important;
  white-space:nowrap;
}

/* =========================================================
   页面3：推荐
========================================================= */

.navbar{
  display:flex;
  align-items:center;
  height:52px;
  min-height:52px;
  background:#fff;
  color:var(--text);
  padding:0 12px;
  box-shadow:0 1px 8px rgba(80,60,30,.08);
  border-bottom:1px solid var(--line);
  position:relative;
  z-index:20;
}

.navbar .back-btn{
  width:32px;
  height:32px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  cursor:pointer;
  border-radius:50%;
  color:var(--text2);
}

.navbar .back-btn:active{ background:var(--bg); }

.navbar .title{
  flex:1;
  text-align:center;
  font-size:17px;
  font-weight:700;
}

.navbar .placeholder{ width:32px; }

.ai-greet{
  display:flex;
  align-items:center;
  gap:10px;
  padding:14px 16px;
  background:#FFF8E9;
  margin:10px 12px;
  border-radius:20px;
}

.ai-avatar{
  width:38px;
  height:38px;
  border-radius:50%;
  background:var(--primary-soft);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  flex-shrink:0;
}

.ai-avatar img{
  width:30px;
  height:30px;
  object-fit:contain;
  display:block;
}

.ai-bubble{
  font-size:13px;
  color:#665c4e;
  font-weight:600;
  line-height:1.4;
}

.cards-scroll{
  flex:1;
  overflow-y:auto;
  padding:0 12px 16px;
}

.rec-card{
  background:#fff;
  border-radius:24px;
  overflow:hidden;
  box-shadow:0 4px 14px rgba(0,0,0,.08);
  margin-bottom:14px;
  border:2px solid transparent;
}

.rec-card.main{
  border-color:var(--primary);
  box-shadow:0 6px 18px rgba(190,150,50,.16);
}

.rec-card .img-wrap{
  height:150px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
}

.rec-card .place-photo{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.rec-card .place-photo.fallback{
  width:72px;
  height:72px;
  object-fit:contain;
}

.rec-card .photo-shade{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:48px;
  background:linear-gradient(transparent,rgba(0,0,0,.18));
  pointer-events:none;
}

.type-food{ background:linear-gradient(135deg,#FFE8D4,#FFD1B2); }
.type-park{ background:linear-gradient(135deg,#DFF1E2,#BFE2C3); }
.type-mall{ background:linear-gradient(135deg,#FFE1EC,#FFC7D8); }
.type-museum{ background:linear-gradient(135deg,#D9E4FF,#BFD1FF); }

.badge-main{
  position:absolute;
  top:8px;
  left:8px;
  background:var(--primary);
  color:#444;
  font-size:11px;
  font-weight:700;
  padding:3px 9px;
  border-radius:12px;
}

.place-favorite-btn{
  position:absolute;
  right:10px;
  top:10px;
  z-index:5;
  width:36px;
  height:36px;
  border:0;
  border-radius:50%;
  background:rgba(255,255,255,.94);
  color:#F3B43F;
  font-size:25px;
  line-height:1;
  box-shadow:0 2px 8px rgba(0,0,0,.12);
  cursor:pointer;
}

.place-favorite-btn.saved{ background:#FFF1C7; color:#E5A000; }

function showToast(msg){
  var t = document.getElementById('toast');
  if(!t) return;
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(function(){ t.style.display = 'none'; }, 2400);
}

function stripHtml(str){
  if(!str) return '';
  var div = document.createElement('div');
  div.innerHTML = String(str);
  return (div.textContent || div.innerText || '').trim();
}

function truncateStepText(text, maxLen){
  if(!text) return '';
  return text.length > maxLen ? text.slice(0, maxLen) + '…' : text;
}

function createMapPointMarker(point, type, clickText, map){
  var marker = new BMapGL.Marker(point, {
    icon: new BMapGL.Icon(
      'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" width="34" height="42" viewBox="0 0 34 42">' +
          '<path d="M17 40 C15.8 38.2 4 25.2 4 16.8 C4 9.2 9.8 3 17 3 C24.2 3 30 9.2 30 16.8 C30 25.2 18.2 38.2 17 40 Z" fill="#62A8F5" stroke="#FFFFFF" stroke-width="2"/>' +
          '<circle cx="17" cy="16.5" r="6" fill="#FFFFFF"/>' +
        '</svg>'
      ),
      new BMapGL.Size(34, 42),
      { anchor: new BMapGL.Size(17, 40) }
    )
  });

  if(clickText){
    marker.addEventListener('click', function(){
      showPointLabel(map, point, clickText);
    });
  }

  return marker;
}

var temporaryPointLabel = null;

function showPointLabel(map, point, text){
  if(temporaryPointLabel && map){
    try{ map.removeOverlay(temporaryPointLabel); }catch(e){}
  }
  temporaryPointLabel = new BMapGL.Label(text, {
    position: point,
    offset: new BMapGL.Size(-25, -40)
  });
  temporaryPointLabel.setStyle({
    background: '#fff',
    color: '#444',
    border: '1px solid #EAE4D8',
    borderRadius: '14px',
    padding: '5px 9px',
    fontSize: '12px',
    fontWeight: '700',
    whiteSpace: 'nowrap',
    boxShadow: '0 3px 10px rgba(50,40,20,.15)'
  });
  map.addOverlay(temporaryPointLabel);
}

function detectFacilityCategory(poi, fallback){
  var title = stripHtml(poi && poi.title);
  var address = stripHtml(poi && poi.address);
  var type = stripHtml(poi && poi.type);
  var text = title + ' ' + address + ' ' + type;

  for(var i = 0; i < FACILITY_CATEGORY_MAP.length; i++){
    var cat = FACILITY_CATEGORY_MAP[i];
    if(new RegExp(cat.keyword).test(text)) return cat;
  }

  return {
    iconFile: fallback.iconFile || '',
    label: fallback.fallbackLabel
  };
}

function getFacilityDisplayName(poi, category){
  var title = stripHtml(poi && poi.title);
  if(title && title !== '无名地点' && title !== '未知地点' && title !== 'undefined'){
    return title;
  }
  return category.label;
}

function goPage(id){
  if(id !== 'page1') stopHomeLocationWatch();
  if(id !== 'page5') stopNavLocationWatch();

  var pages = document.querySelectorAll('.page');
  for(var i = 0; i < pages.length; i++) pages[i].classList.remove('active');

  var target = document.getElementById(id);
  if(target) target.classList.add('active');

  if(id === 'page1'){
    setTimeout(function(){
      if(map1) map1.resize();
      startHomeLocationWatch();
    }, 80);
  }

  if(id === 'page4'){
    setTimeout(function(){ initMap2AndRoute(); }, 80);

  if(id === 'page5'){
    setTimeout(function(){ initMap3AndNav(); }, 80);
  }
}

/* =========================================================
   首页地图与定位
========================================================= */

function initMap1(){
  try{
    map1 = new BMapGL.Map('map1');
    var center = new BMapGL.Point(DEFAULT_CENTER.lng, DEFAULT_CENTER.lat);
    map1.centerAndZoom(center, 14);
    map1.enableScrollWheelZoom(true);
    startHomeLocationWatch();
  }catch(e){
    console.error('首页地图初始化失败', e);
    showToast('地图初始化失败，请检查网络或百度地图AK');
  }
}

function startHomeLocationWatch(){
  if(homeWatchId !== null) return;
  if(!navigator.geolocation){
    showToast('当前浏览器不支持定位');
    return;
  }

  try{
    navigator.geolocation.getCurrentPosition(
      function(position){ handleHomePosition(position); },
      function(error){ handleLocationError(error); },
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 5000 }
    );

    homeWatchId = navigator.geolocation.watchPosition(
      function(position){ handleHomePosition(position); },
      function(error){ handleLocationError(error); },
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 3000 }
    );
  }catch(e){ console.error(e); }
}

function stopHomeLocationWatch(){
  if(homeWatchId !== null && navigator.geolocation){
    try{ navigator.geolocation.clearWatch(homeWatchId); }catch(e){}
  }
  homeWatchId = null;
}

function handleHomePosition(position){
  if(!position || !position.coords) return;
  var lat
