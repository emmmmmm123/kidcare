<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>遛娃地图</title>

<!-- =========================================================
     百度地图 API
========================================================= -->
<script src="https://api.map.baidu.com/api?type=webgl&v=1.0&ak=o8LnSUIDI7AiJDfc9eRMNz3YDSdKHkRn&s=1"></script>

<style>
/* =========================================================
   全局
========================================================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --bg:#EAF6FF;
  --card:#FFFFFF;

  /* 主色：淡黄色 */
  --primary:#FFE7A3;
  --primary-soft:#FFF0C2;

  /* 起点 / 终点 */
  --start:#62A8F5;
  --start-soft:#DDEEFF;
  --end:#62A8F5;
  --end-soft:#DDEEFF;

  /* 路线 */
  --route:#62A8F5;

  --blue:#348FDA;
  --green:#63B26E;
  --orange:#F79256;
  --purple:#C38DDE;

  --text:#222222;
  --text2:#444444;
  --muted:#888888;
  --line:#EAE4D8;
}

html,
body{
  width:100%;
  height:100%;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "PingFang SC",
    "Helvetica Neue",
    Arial,
    sans-serif;
  background:var(--bg);
  color:var(--text);
}

#app{
  position:relative;
  width:100%;
  height:100vh;
  max-width:600px;
  margin:0 auto;
  overflow:hidden;
  background:var(--bg);
}

.page{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:none;
  flex-direction:column;
  background:var(--bg);
}

#page1{
  overflow-y:auto;
  overflow-x:hidden;
  scrollbar-width:none;
}

#page1::-webkit-scrollbar{
  display:none;
}

.page.active{
  display:flex;
}


/* =========================================================
   通用按钮
========================================================= */

button{
  font-family:inherit;
}

.primary-btn,
.start-btn,
.nav-start-btn{
  background:var(--primary)!important;
  color:var(--text)!important;
  border:1px solid var(--primary)!important;
}

.start-btn:active,
.nav-start-btn:active{
  transform:scale(.98);
}


/* =========================================================
   页面1：首页
========================================================= */

/* =========================================================
   首页顶部 / Banner / 宝宝 / 出行目的
========================================================= */

.top-bar{
  flex-shrink:0;
  background:#fff;
  padding:12px 16px 12px;
  color:var(--text);
  border-radius:0 0 20px 20px;
  box-shadow:0 2px 10px rgba(80,60,30,.06);
  z-index:20;
}

.top-row{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:0;
  min-width:0;
}

.loc-wrap{
  display:flex;
  align-items:center;
  gap:7px;
  min-width:0;
  flex:1 1 auto;
  overflow:hidden;
}

.loc-pin{
  width:18px;
  height:22px;
  flex:0 0 18px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.loc-pin svg{
  width:18px;
  height:22px;
  display:block;
}

.loc-edit-input{
  border:none;
  outline:none;
  background:transparent;
  padding:0;
  width:16ch;
  max-width:16ch;
  min-width:0;
  flex:0 1 16ch;
  color:#333333;
  font-size:14px;
  font-weight:500;
  line-height:22px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.loc-edit-input::placeholder{
  color:#777777;
}

.locate-btn{
  width:24px;
  height:24px;
  border-radius:50%;
  background:#EAF4FF;
  color:#4096FF;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:14px;
  flex:0 0 24px;
  cursor:pointer;
}

.locate-btn:active{
  transform:scale(.92);
}

.weather-chip{
  height:40px;
  min-width:76px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  background:#FFF7EA;
  border-radius:20px;
  padding:0 10px;
  flex:0 0 auto;
}

.weather-icon{
  width:18px;
  height:18px;
  border-radius:50%;
  background:#FFD66B;
  box-shadow:0 0 0 3px #FFF0C2;
  flex:0 0 18px;
}

.weather-copy{
  display:flex;
  flex-direction:column;
  justify-content:center;
  line-height:1;
}

.weather-temp{
  font-size:16px;
  color:#222222;
  font-weight:700;
}

.weather-desc{
  margin-top:4px;
  font-size:12px;
  color:#666666;
}

.suggest-list{
  margin-top:8px;
  background:#fff;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 4px 10px rgba(0,0,0,.12);
  display:none;
}

.suggest-item{
  padding:9px 14px;
  font-size:13px;
  color:#555;
  border-bottom:1px solid #f5f5f5;
}

.suggest-item:last-child{
  border-bottom:none;
}

.suggest-item:active{
  background:#F5F9FF;
}

.banner-home{
  position:relative;
  flex-shrink:0;
  height:174px;
  margin:4px 16px 8px;
  padding:22px 12px 16px 18px;
  overflow:hidden;
  border-radius:0;
  background:transparent;
}

.banner-title{
  position:relative;
  z-index:2;
  max-width:none;
  white-space:nowrap;
  font-size:32px;
  line-height:1.18;
  font-weight:800;
  letter-spacing:-1px;
  color:#62A8F5;
}

.banner-subtitle{
  position:relative;
  z-index:2;
  margin-top:9px;
  max-width:none;
  white-space:nowrap;
  font-size:16px;
  line-height:1.5;
  color:#62A8F5;
}


.home-content{
  flex-shrink:0;
  padding:0 16px 24px;
}

#map1{
  width:calc(100% - 32px);
  height:220px;
  flex:0 0 220px;
  margin:0 16px 18px;
  border-radius:20px;
  overflow:hidden;
  background:#EAF4FF;
  box-shadow:0 2px 12px rgba(70,120,170,.10);
}

.home-card{
  background:#FFFFFF;
  border-radius:16px;
  padding:16px;
  margin-bottom:12px;
  box-shadow:0 2px 12px rgba(30,60,90,.05);
}

.home-card-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  margin-bottom:14px;
}

.home-card-title-wrap{
  min-width:0;
}

.home-title-line{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}
.memory-book-btn{
  border:0;
  background:transparent;
  border-radius:8px;
  width:32px;
  height:32px;
  padding:0;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  font-size:23px;
  box-shadow:none;
}
.memory-mask{
  position:fixed;inset:0;z-index:3000;background:rgba(43,65,88,.38);
  display:none;align-items:flex-end;justify-content:center;padding:14px;
}
.memory-mask.show{display:flex;}
.memory-panel{
  width:100%;max-width:520px;max-height:82vh;overflow:auto;background:#FFFDF7;
  border-radius:26px 26px 22px 22px;padding:20px 16px 24px;
  box-shadow:0 12px 40px rgba(30,50,80,.2);
  border:3px solid #FFF0C8;
}
.memory-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.memory-title{font-size:21px;font-weight:800;color:#473A2B;}
.memory-close{border:0;background:#F4E8D5;border-radius:50%;width:32px;height:32px;font-size:18px;color:#775F40;}
.memory-tabs{display:flex;gap:8px;margin-bottom:14px;}
.memory-tab{flex:1;border:0;border-radius:12px;padding:10px;background:#FFFFFF;color:#786B59;font-size:14px;font-weight:700;}
.memory-tab.active{background:#FFFFFF;color:#604B24;box-shadow:inset 0 -2px 0 #E8D8B8;}
.memory-list{display:flex;flex-direction:column;gap:9px;}
.memory-item{background:#FFFFFF;border:1px solid #F5E8CF;border-radius:16px;padding:12px;display:flex;gap:10px;align-items:center;}
.memory-item-emoji{width:38px;height:38px;border-radius:13px;background:#EAF4FF;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.memory-item-main{min-width:0;flex:1;}
.memory-item-name{font-size:14px;font-weight:800;color:#333;overflow-wrap:anywhere;}
.memory-item-meta{font-size:12px;color:#888;margin-top:4px;}
.memory-item-action{border:0;background:#FFF2F6;border-radius:12px;padding:7px 9px;color:#C66C8B;font-size:12px;white-space:nowrap;}
.memory-empty{text-align:center;padding:28px 12px;color:#9A8D7C;font-size:13px;background:#FFF8E9;border-radius:18px;}

.home-card-title{
  font-size:20px;
  line-height:1.25;
  font-weight:800;
  color:#222222;
}

.home-card-subtitle{
  margin-top:4px;
  font-size:13px;
  line-height:1.4;
  color:#777777;
}

.home-add{
  border:none;
  background:transparent;
  color:#4096FF;
  font-size:14px;
  line-height:22px;
  white-space:nowrap;
  cursor:pointer;
  padding:0;
}

.baby-list{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:8px;
}

@media (max-width:390px){
  .baby-list{
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:6px;
  }
}

.baby-card{
  position:relative;
  min-width:0;
  min-height:92px;
  padding:12px 30px 12px 10px;
  border:1px solid #E9EDF2;
  border-radius:16px;
  background:#FFFFFF;
  cursor:pointer;
  transition:.18s ease;
}

.baby-card.pink{
  background:#FFF2F6;
  border-color:#FFF2F6;
}

.baby-card.green{
  background:#F2FBF8;
  border-color:#F2FBF8;
}

.baby-card.selected{
  border:1.5px solid #FFE7A3;
  background:#FFE7A3;
  box-shadow:0 2px 8px rgba(255,231,163,.24);
}

.baby-info-row{
  display:flex;
  align-items:center;
  gap:0;
  min-width:0;
}

.baby-avatar{
  display:none;
  width:42px;
  height:42px;
  flex:0 0 42px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#E8F2FF;
  overflow:hidden;
}

.baby-avatar .baby-gender-icon{
  width:30px;
  height:30px;
  object-fit:contain;
  display:block;
}

.baby-card.pink .baby-avatar{
  background:#FFE0EA;
}

.baby-card.green .baby-avatar{
  background:#DDF4EA;
}

.baby-detail{
  min-width:0;
  flex:1 1 auto;
}

.baby-name{
  display:block;
  font-size:17px;
  line-height:1.2;
  font-weight:800;
  color:#222222;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  letter-spacing:-.2px;
}

.baby-age{
  margin-top:5px;
  font-size:14px;
  line-height:1.2;
  color:#666666;
  white-space:nowrap;
}

.baby-edit-btn{
  position:absolute;
  top:8px;
  right:8px;
  width:24px;
  height:24px;
  padding:0;
  border:none;
  border-radius:50%;
  background:rgba(255,255,255,.72);
  color:#4096FF;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  z-index:2;
}

.baby-edit-btn svg{
  width:14px;
  height:14px;
}

.baby-delete-btn{
  position:absolute;
  right:8px;
  bottom:8px;
  width:22px;
  height:22px;
  padding:0;
  border:none;
  border-radius:50%;
  background:rgba(255,255,255,.78);
  color:#999999;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  z-index:2;
}

.baby-delete-btn svg{
  width:13px;
  height:13px;
}

/* 宝宝编辑弹窗 */
.baby-modal-mask{
  position:fixed;
  inset:0;
  z-index:200;
  display:none;
  align-items:flex-end;
  justify-content:center;
  background:rgba(25,35,50,.34);
}

.baby-modal-mask.show{
  display:flex;
}

.baby-modal{
  width:min(100%,600px);
  background:#FFFFFF;
  border-radius:24px 24px 0 0;
  padding:20px 18px 24px;
  box-shadow:0 -8px 30px rgba(30,60,90,.12);
}

.baby-modal-title{
  font-size:20px;
  font-weight:800;
  color:#222222;
  text-align:center;
  margin-bottom:18px;
}

.baby-form-row{
  margin-bottom:14px;
}

.baby-form-label{
  display:block;
  margin-bottom:7px;
  font-size:13px;
  color:#666666;
}

.baby-form-input{
  width:100%;
  height:44px;
  border:1px solid #E6EAF0;
  border-radius:12px;
  outline:none;
  padding:0 12px;
  font-size:15px;
  color:#222222;
  background:#FAFBFD;
}

.baby-gender-options{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.baby-gender-option{
  height:52px;
  border:1px solid #E6EAF0;
  border-radius:14px;
  background:#FFFFFF;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  font-size:15px;
  color:#444444;
  cursor:pointer;
}

.baby-gender-option.selected.boy{
  border-color:#62A8F5;
  background:#EAF4FF;
  color:#348FDA;
}

.baby-gender-option.selected.girl{
  border-color:#E98BA8;
  background:#FFF2F6;
  color:#C66C8B;
}

.baby-gender-option svg{
  width:28px;
  height:28px;
}

.baby-modal-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:18px;
}

.baby-modal-btn{
  height:44px;
  border-radius:22px;
  border:none;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.baby-modal-btn.cancel{
  background:#F3F5F7;
  color:#666666;
}

.baby-modal-btn.save{
  background:#4096FF;
  color:#FFFFFF;
}

.purpose-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:10px 8px;
}

.purpose-item{
  min-width:0;
  border:none;
  background:transparent;
  padding:0;
  cursor:pointer;
  text-align:center;
}

.purpose-icon-box{
  width:54px;
  height:54px;
  margin:0 auto 6px;
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.purpose-icon-box.food{background:#FFF5E0;}
.purpose-icon-box.play{background:#E8F2FF;}
.purpose-icon-box.outdoor{background:#EDF9EF;}
.purpose-icon-box.shop{background:#FCEEF6;}
.purpose-icon-box.medical{background:#E8F2FF;}
.purpose-icon-box.culture{background:#FFF5E0;}
.purpose-icon-box.sport{background:#FFF0E8;}

.purpose-icon-box img{
  width:32px;
  height:32px;
  object-fit:contain;
}

.purpose-label{
  display:block;
  font-size:13px;
  line-height:1.3;
  color:#444444;
  white-space:nowrap;
}

.purpose-item.active .purpose-icon-box{
  background:#FFE7A3!important;
  box-shadow:inset 0 0 0 2px #FFE7A3;
}

.start-btn{
  width:100%;
  margin:4px 0 0;
  border:none!important;
  border-radius:24px!important;
  padding:13px 0;
  background:#FFE7A3!important;
  color:#222222!important;
  font-size:18px;
  line-height:24px;
  font-weight:700;
  box-shadow:0 6px 14px rgba(255,231,163,.28);
  cursor:pointer;
}

.start-btn:active{
  transform:scale(.985);
}

.demo-tag{
  display:none;
}

#map1{
  width:100%;
  flex:1;
  min-height:0;
}

/* 旧首页底部面板样式已移除：首页改为卡片式滚动布局。 */

/* 推荐卡片中的类型图标 */
.rec-name-row{
  display:flex;
  align-items:center;
  gap:7px;
  min-width:0;
}

.rec-type-icon{
  width:24px;
  height:24px;
  object-fit:contain;
  flex-shrink:0;
}

.rec-type-label{
  margin-left:2px;
  padding:2px 7px;
  border-radius:9px;
  background:#F5F8FA;
  color:#888;
  font-size:10px;
  font-weight:600;
  flex-shrink:0;
}

/* =========================================================
   地图圆润起终点图标
========================================================= */

.map-point-icon{
  width:20px;
  height:20px;
  border-radius:50%;
  position:relative;
  border:4px solid rgba(255,255,255,.95);
  box-shadow:
    0 2px 8px rgba(0,0,0,.20);
}

.map-point-icon.start{
  background:var(--start);
}

.map-point-icon.end{
  background:var(--end);
}

.map-point-icon.user{
  background:#B7D9FF;
}


/* =========================================================
   地图点击信息
========================================================= */

.map-click-label{
  background:#fff!important;
  color:var(--text2)!important;
  border:1px solid var(--line)!important;
  border-radius:14px!important;
  padding:5px 9px!important;
  box-shadow:0 3px 10px rgba(50,40,20,.15)!important;
  font-size:12px!important;
  font-weight:700!important;
  white-space:nowrap;
}


/* =========================================================
   页面3：推荐
========================================================= */

.navbar{
  display:flex;
  align-items:center;
  height:52px;
  min-height:52px;
  background:#fff;
  color:var(--text);
  padding:0 12px;
  box-shadow:0 1px 8px rgba(80,60,30,.08);
  border-bottom:1px solid var(--line);
  position:relative;
  z-index:20;
}

.navbar .back-btn{
  width:32px;
  height:32px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  cursor:pointer;
  border-radius:50%;
  color:var(--text2);
}

.navbar .back-btn:active{
  background:var(--bg);
}

.navbar .title{
  flex:1;
  text-align:center;
  font-size:17px;
  font-weight:700;
}

.navbar .placeholder{
  width:32px;
}

.ai-greet{
  display:flex;
  align-items:center;
  gap:10px;
  padding:14px 16px;
  background:#FFF8E9;
  margin:10px 12px;
  border-radius:20px;
}

.ai-avatar{
  width:38px;
  height:38px;
  border-radius:50%;
  background:var(--primary-soft);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  flex-shrink:0;
}

.ai-avatar img{width:30px;height:30px;object-fit:contain;display:block;}

.ai-bubble{
  font-size:13px;
  color:#665c4e;
  font-weight:600;
  line-height:1.4;
}

.cards-scroll{
  flex:1;
  overflow-y:auto;
  padding:0 12px 16px;
}

.rec-card{
  background:#fff;
  border-radius:24px;
  overflow:hidden;
  box-shadow:0 4px 14px rgba(0,0,0,.08);
  margin-bottom:14px;
  border:2px solid transparent;
}

.rec-card.main{
  border-color:var(--primary);
  box-shadow:0 6px 18px rgba(190,150,50,.16);
}

.rec-card .img-wrap{
  height:150px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
}

.rec-card .place-photo{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.rec-card .place-photo.fallback{
  width:72px;
  height:72px;
  object-fit:contain;
}

.rec-card .photo-shade{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:48px;
  background:linear-gradient(transparent,rgba(0,0,0,.18));
  pointer-events:none;
}

.type-food{
  background:linear-gradient(135deg,#FFE8D4,#FFD1B2);
}

.type-park{
  background:linear-gradient(135deg,#DFF1E2,#BFE2C3);
}

.type-mall{
  background:linear-gradient(135deg,#FFE1EC,#FFC7D8);
}

.type-museum{
  background:linear-gradient(135deg,#D9E4FF,#BFD1FF);
}

.badge-main{
  position:absolute;
  top:8px;
  left:8px;
  background:var(--primary);
  color:#444;
  font-size:11px;
  font-weight:700;
  padding:3px 9px;
  border-radius:12px;
}

.rec-card .body{
  padding:12px 14px 14px;
}

.rec-card .name{
  font-size:16px;
  font-weight:700;
  color:#333;
}

.stars-row{
  display:flex;

========================================================= */

}

}

.nav-category{

  height:23px;

}

  border-color:#B7D9BC;
}

.nav-category[data-tone="orange"].active{
  background:#FDE4D3;
  border-color:#F2C2A4;
}

  border-color:#D7B5E7;
}

.nav-category[data-tone="blue"].active{

  border-color:#B6D8F6;
}


/* ---------- 地图 ---------- */

  flex:1;

  overflow:hidden;

  margin-bottom:3px;

}


/* ---------- 结束导航 ---------- */

.end-nav-btn{

  left:14px;
  right:14px;
  bottom:8px;
  z-index:26;

  border-radius:18px;
  padding:8px 0;
  font-size:13px;
  font-weight:700;
  text-align:center;
  cursor:pointer;
}

.nav-detail-drawer{
  position:absolute;
  left:12px;
  right:12px;
  bottom:12px;
  min-height:150px;
  background:#fff;
  border-radius:20px;

  gap:10px;
}

.nav-detail-drawer.show{

}

.nav-detail-img{
  width:72px;
  height:72px;
  border-radius:16px;

  align-items:center;
  justify-content:center;
  font-size:32px;
}

.nav-detail-content{
  min-width:0;
}

.nav-detail-title{
  font-size:17px;
  font-weight:700;
  color:var(--text);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.nav-detail-meta{
  margin-top:6px;

  gap:8px;
  flex-wrap:wrap;
}

.nav-detail-tags{
  margin-top:7px;

  gap:5px;
  flex-wrap:wrap;
}

.nav-detail-tags span{

  border-radius:9px;
  padding:3px 7px;
}

.nav-detail-desc{
  margin-top:7px;
  font-size:12px;
  color:var(--muted);
  line-height:1.45;
}

.nav-detail-action{
  align-self:center;
  background:var(--primary);
  color:#444;
  border:0;
  border-radius:10px;
  padding:8px 5px;
  font-size:12px;
  font-weight:700;
  cursor:pointer;
}


/* =========================================================
   Toast
========================================================= */

.toast{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:rgba(0,0,0,.78);
  color:#fff;
  padding:10px 18px;
  border-radius:14px;
  font-size:13px;
  z-index:999;
  display:none;
  max-width:80%;
  text-align:center;
}

function showToast(msg){

  var t=document.getElementById('toast');

  if(!t){
    return;
  }

  t.textContent=msg;
  t.style.display='block';

  clearTimeout(window._toastTimer);

  window._toastTimer=setTimeout(
    function(){
      t.style.display='none';
    },
    2400
  );

}


function stripHtml(str){

  if(!str){
    return '';
  }

  var div=document.createElement('div');

  div.innerHTML=String(str);

  return (
    div.textContent ||
    div.innerText ||
    ''
  ).trim();

}


function truncateStepText(text,maxLen){

  if(!text){
    return '';
  }

  return text.length>maxLen
    ? text.slice(0,maxLen)+'…'
    : text;

}


function truncateFacilityName(
  name,
  maxLen
){

  if(!name){
    return '亲子设施';

  name=String(name);

  return name.length>maxLen
    ? name.slice(0,maxLen)+'…'
    : name;

}

      );

  }

        position:point,
        offset:new BMapGL.Size(

    fontSize:'12px',

  });

    temporaryPointLabel
  );

}

function detectFacilityCategory(
  poi,
  fallback
){

  var title=
    stripHtml(
      poi && poi.title
    );

  var address=
    stripHtml(
      poi && poi.address
    );

  var type=
    stripHtml(
      poi && poi.type
    );

  var text=
    title+' '+
    address+' '+
    type;

  for(
    var i=0;
    i<FACILITY_CATEGORY_MAP.length;
    i++
  ){

    var cat=
      FACILITY_CATEGORY_MAP[i];

    if(
      new RegExp(
        cat.keyword
      ).test(text)
    ){

      return cat;

    }

  }

  return {
    iconFile:fallback.iconFile || '',
    label:fallback.fallbackLabel
  };

}


function getFacilityDisplayName(
  poi,
  category
){

  var title=
    stripHtml(
      poi && poi.title
    );

  if(
    title &&
    title!=='无名地点' &&
    title!=='未知地点' &&
    title!=='undefined'
  ){

    return title;

  }

  return category.label;

}

/* =========================================================
   首页定位
========================================================= */

function startHomeLocationWatch(){

  if(homeWatchId!==null){
    return;
  }

  if(!navigator.geolocation){

    showToast(
      '当前浏览器不支持定位'
    );

    return;

  }

  try{

    navigator.geolocation.getCurrentPosition(

      function(position){
        handleHomePosition(
          position
        );
      },

      function(error){
        handleLocationError(
          error
        );
      },

      {
        enableHighAccuracy:true,
        timeout:10000,
        maximumAge:5000
      }

    );


    homeWatchId=
      navigator.geolocation.watchPosition(

        function(position){
          handleHomePosition(
            position
          );
        },

        function(error){
          handleLocationError(
            error
          );
        },

        {
          enableHighAccuracy:true,
          timeout:15000,
          maximumAge:3000
        }

      );

  }catch(e){

    console.error(e);

  }

}


function stopHomeLocationWatch(){

  if(
    homeWatchId!==null &&
    navigator.geolocation
  ){

    try{

      navigator.geolocation.clearWatch(
        homeWatchId
      );

    }catch(e){}

  }

  homeWatchId=null;

}


function handleHomePosition(
  position
){

  if(
    !position ||
    !position.coords
  ){
    return;
  }

  var lat=
    position.coords.latitude;

  var lng=
    position.coords.longitude;

  if(
    typeof lat!=='number' ||
    typeof lng!=='number'
  ){
    return;
  }

  var point=
    new BMapGL.Point(
      lng,
      lat
    );

  userPoint=point;

  updateHomeUserMarker(
    point
  );

  reverseGeocode(
    point
  );

  if(!window._homeFirstLocated){

    window._homeFirstLocated=true;

    if(map1){

      map1.centerAndZoom(
        point,
        16
      );

    }

  }

}


function updateHomeUserMarker(
  point
){

  if(
    !map1 ||
    !point
  ){
    return;
  }

  if(homeUserMarker){

    try{
      map1.removeOverlay(
        homeUserMarker
      );
    }catch(e){}

  }

  if(homeUserLabel){

    try{
      map1.removeOverlay(
        homeUserLabel
      );
    }catch(e){}

    homeUserLabel=null;

  }

  /*
   * 首页只显示圆形当前位置，
   * 默认不显示“我的实时位置”文字。
   */

  homeUserMarker=
    createMapPointMarker(
      point,
      'user',
      '我的位置',
      map1
    );

  map1.addOverlay(
    homeUserMarker
  );

}


function handleLocationError(
  error
){

  console.warn(
    '定位失败',
    error
  );

  if(!userPoint){

    var input=
      document.getElementById(
        'curAddrInput'
      );

    if(input){
      input.value=
        '暂时无法获取当前位置';
    }

    showToast(
      '无法获取当前位置，请允许浏览器使用定位权限'
    );

  }

}


function doGeolocation(
  force
){

  if(force){

    window._homeFirstLocated=false;

    stopHomeLocationWatch();

  }

  if(
    !navigator.geolocation
  ){

    showToast(
      '当前浏览器不支持定位'
    );

    return;

  }

  showToast(
    '正在获取当前位置...'
  );

  startHomeLocationWatch();

}


/* =========================================================
   地址解析
========================================================= */

function reverseGeocode(
  point
){

  if(!point){
    return;
  }

  try{

    var geoc=
      new BMapGL.Geocoder();

    geoc.getLocation(
      point,
      function(result){

        if(
          result &&
          result.address
        ){

          var comp=result.addressComponents||{};
          var district=String(comp.district||'').trim();
          var street=String(comp.street||'').trim();
          var streetNumber=String(comp.streetNumber||'').trim();
          var districtAddress='';
          if(district){
            districtAddress=district;
            if(street) districtAddress+=' '+street;
            if(streetNumber) districtAddress+=streetNumber;
          }else{
            districtAddress=result.address||'';
          }

          currentAddrText=
            truncateHomeAddress(districtAddress,16);

          var input=
            document.getElementById(
              'curAddrInput'
            );

          if(
            input &&
            document.activeElement!==input
          ){

            input.value=
              currentAddrText;

          }

        }

      }
    );

  }catch(e){}

}

var addrDebounce=null;


function truncateHomeAddress(text,maxLen){
  text=String(text||'');
  return text.length>maxLen ? text.slice(0,maxLen)+'…' : text;
}

function onAddrInput(){

  clearTimeout(
    addrDebounce
  );

  var input=
    document.getElementById(
      'curAddrInput'
    );

  var kw=
    input.value.trim();

  if(!kw){

    document.getElementById(
      'suggestList'
    ).style.display='none';

    return;

  }

  addrDebounce=
    setTimeout(
      function(){

        try{

          var local=
            new BMapGL.LocalSearch(
              map1,
              {
                pageCapacity:6,

                onSearchComplete:
                  function(results){

                    renderSuggestFromSearch(
                      results
                    );

                  }

              }
            );

          local.search(
            kw
          );

        }catch(e){

          document.getElementById(
            'suggestList'
          ).style.display='none';

        }

      },
      250
    );

}


function renderSuggestFromSearch(
  res
){

  var box=
    document.getElementById(
      'suggestList'
    );

  box.innerHTML='';

  if(
    !res ||
    !res.getNumPois ||
    res.getNumPois()===0
  ){

    box.style.display='none';

    return;

  }

  var n=
    Math.min(
      res.getNumPois(),
      6
    );

  for(
    var i=0;
    i<n;
    i++
  ){

    var poi=
      res.getPoi(i);

    var div=
      document.createElement(
        'div'
      );

    div.className=
      'suggest-item';

    div.textContent=
      stripHtml(
        poi.title ||
        poi.address ||
        ''
      );

    div.onclick=
      (function(p){

        return function(){

          if(!p.point){
            return;
          }

          userPoint=
            p.point;

          currentAddrText=
            truncateHomeAddress(
              stripHtml(p.title || p.address || ''),
              16
            );

          document.getElementById(
            'curAddrInput'
          ).value=
            currentAddrText;

          document.getElementById(
            'suggestList'
          ).style.display='none';

          if(map1){

            map1.centerAndZoom(
              userPoint,
              16
            );

          }

          updateHomeUserMarker(
            userPoint
          );

        };

      })(poi);

    box.appendChild(
      div
    );

  }

  box.style.display='block';

}

function getBabyAgeYears(birthYear){
  var y=parseInt(birthYear,10);
  if(!y) return null;
  var now=new Date();
  var age=now.getFullYear()-y;
  if(age<0) age=0;
  return age;
}

function getBabyAgeText(birthYear){
  var age=getBabyAgeYears(birthYear);
  if(age===null) return '未填写年龄';
  if(age===0) return '0岁';
  return age+'岁';
}

function getBabyAgeRange(birthYear){
  var age=getBabyAgeYears(birthYear);
  if(age===null) return '0-3';
  if(age<3) return '0-3';
  if(age<6) return '3-6';
  return '6-12';
}

function escapeHtml(value){
  return String(value==null?'':value)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

function genderIconSvg(gender,birthYear){
  var age=getBabyAgeYears(birthYear);
  var file;
  if(age!==null && age<3){
    file='baby.png';
  }else if(gender==='女'){
    file='girl.png';
  }else if(gender==='男'){
    file='boy.png';
  }else{
    file='baby.png';
  }
  return '<img class="baby-gender-icon" src="icons/'+file+'" alt="" aria-hidden="true">';
}

function editIconSvg(){
  return '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="m14.7 5.3 4 4L8 20H4v-4L14.7 5.3Z" fill="none" stroke="#4096FF" stroke-width="1.8" stroke-linejoin="round"/><path d="m13.4 6.6 4 4" fill="none" stroke="#4096FF" stroke-width="1.8"/></svg>';
}

function deleteIconSvg(){
  return '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M7 8v11h10V8M9 8V5h6v3M5 8h14" fill="none" stroke="#999999" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}

function renderBabyProfiles(){
  var list=document.getElementById('babyList');
  if(!list) return;
  list.innerHTML='';

  for(var i=0;i<babyProfiles.length;i++){
    var b=babyProfiles[i];
    var card=document.createElement('div');
    var tone=i%3===1?'pink':(i%3===2?'green':'');
    card.className='baby-card '+tone+(i===selectedBabyIndex?' selected':'');
    card.setAttribute('data-index',i);
    card.onclick=(function(index){
      return function(){ selectBabyCard(index); };
    })(i);

    card.innerHTML=
      '<div class="baby-info-row">'+
        '<div class="baby-avatar">'+genderIconSvg(b.gender,b.birthYear)+'</div>'+
        '<div class="baby-detail">'+
          '<span class="baby-name">'+escapeHtml(b.name)+'</span>'+
          '<div class="baby-age">'+escapeHtml(getBabyAgeText(b.birthYear))+'</div>'+
        '</div>'+
      '</div>'+
      '<button type="button" class="baby-edit-btn" aria-label="编辑宝宝信息">'+editIconSvg()+'</button>'+
      '<button type="button" class="baby-delete-btn" aria-label="删除宝宝">'+deleteIconSvg()+'</button>';

    var edit=card.querySelector('.baby-edit-btn');
    edit.onclick=(function(index){
      return function(ev){
        ev.stopPropagation();
        openBabyEditor(index);
      };
    })(i);

    var del=card.querySelector('.baby-delete-btn');
    del.onclick=(function(index){
      return function(ev){
        ev.stopPropagation();
        deleteBabyProfile(index);
      };
    })(i);

    list.appendChild(card);
  }
}

function selectBabyCard(index){
  if(!babyProfiles[index]) return;

  selectedBabyIndex=index;
  babyProfile={
    name:babyProfiles[index].name,
    gender:babyProfiles[index].gender,
    age:getBabyAgeRange(babyProfiles[index].birthYear)
  };
  selectedAge=babyProfile.age;

  var cards=document.querySelectorAll('#babyList .baby-card');
  for(var i=0;i<cards.length;i++){
    cards[i].classList.toggle('selected',i===index);
  }
}

function deleteBabyProfile(index){
  if(!babyProfiles[index]) return;
  if(!window.confirm('确定删除'+(babyProfiles[index].name||'宝宝')+'的信息吗？')) return;

  babyProfiles.splice(index,1);

  if(babyProfiles.length===0){
    selectedBabyIndex=-1;
    babyProfile={name:'',gender:'',age:'0-3'};
    selectedAge='0-3';
  }else if(selectedBabyIndex===index){
    selectedBabyIndex=Math.min(index,babyProfiles.length-1);
  }else if(selectedBabyIndex>index){
    selectedBabyIndex--;
  }

  renderBabyProfiles();
  if(selectedBabyIndex>=0) selectBabyCard(selectedBabyIndex);
}

  editingBabyIndex=null;

  editingBabyIndex=index;
  editingBabyGender=current.gender||'男';
  document.getElementById('babyModalTitle').textContent='编辑宝宝信息';

}

function updateBabyGenderButtons(){

  var girl=document.getElementById('babyGenderGirl');
  var boyIcon=document.getElementById('babyGenderBoyIcon');
  var girlIcon=document.getElementById('babyGenderGirlIcon');

function saveBabyEditor(){
  var name=(document.getElementById('babyNameInput').value||'').trim();
  var year=parseInt(document.getElementById('babyBirthYearInput').value,10);
  var currentYear=new Date().getFullYear();

  if(!name){
    showToast('请填写宝宝昵称');
    return;
  }
  if(!year || year<2010 || year>currentYear){
    showToast('请输入正确的出生年份');
    return;
  }

  if(editingBabyIndex===null){
    var newIndex=babyProfiles.length;
    babyProfiles.push({name:name,gender:editingBabyGender,birthYear:year});
    selectedBabyIndex=newIndex;
  }else{
    babyProfiles[editingBabyIndex]={
      name:name,
      gender:editingBabyGender,
      birthYear:year
    };
    selectedBabyIndex=editingBabyIndex;
  }

  selectBabyCard(selectedBabyIndex);
  renderBabyProfiles();
  document.getElementById('babyModalMask').classList.remove('show');
}

function getRecommendationKeywords(){

  var map={
    '吃饭':['亲子餐厅','儿童餐厅','亲子餐饮','餐厅'],
    '游玩':['儿童乐园','亲子乐园','游乐园','室内儿童乐园'],
    '户外':['亲子公园','儿童公园','公园','动物园'],
    '购物':['亲子商场','商场','购物中心','大型商场'],
    '就医':['儿童医院','儿科医院','妇幼保健院','医院'],
    '文化场馆':['少年宫','青少年宫','图书馆','文化馆','博物馆'],
    '运动健身':['游泳馆','体育场','体育馆','运动中心','健身房']
  };

  return map[selectedPurpose] || ['亲子地点','儿童乐园','公园'];
}

function collectRecommendationPois(results,base,list,seen){

  if(!results || !results.getNumPois || results.getNumPois()<=0){
    return;
  }

  var n=Math.min(results.getNumPois(),10);
  for(var i=0;i<n;i++){
    var poi=results.getPoi(i);
    if(!poi || !poi.point){
      continue;
    }

    var key=(poi.uid || stripHtml(poi.title||''))+'_'+
      poi.point.lng.toFixed(5)+'_'+poi.point.lat.toFixed(5);

    if(seen[key]){
      continue;
    }

    seen[key]=true;
    list.push(poi);
  }
}

function searchRecommendationRange(base,keywords,keywordIndex,radii,radiusIndex,list,seen){

  if(list.length>=5){
    buildRecommendations(list.slice(0,8),base);
    return;
  }

  if(keywordIndex>=keywords.length){
    if(list.length>0){
      buildRecommendations(list.slice(0,8),base);
    }else{
      showToast('附近暂未检索到相关地点');
      goPage('page1');
    }
    return;
  }

  if(radiusIndex>=radii.length){
    searchRecommendationRange(
      base,keywords,keywordIndex+1,radii,0,list,seen
    );
    return;
  }

  var keyword=keywords[keywordIndex];
  var radius=radii[radiusIndex];

  try{
    var local=new BMapGL.LocalSearch(map1,{
      pageCapacity:10,
      renderOptions:{map:null,autoViewport:false},
      onSearchComplete:function(results){
        collectRecommendationPois(results,base,list,seen);

        /* 对应类型结果不足时，继续扩大半径；只有仍不足才换同类型近义词。 */
        if(list.length>=5){
          buildRecommendations(list.slice(0,8),base);
        }else{
          searchRecommendationRange(
            base,keywords,keywordIndex,radii,radiusIndex+1,list,seen
          );
        }
      }
    });

    local.searchNearby(keyword,base,radius);

  }catch(e){
    searchRecommendationRange(
      base,keywords,keywordIndex,radii,radiusIndex+1,list,seen
    );
  }
}

function startPlanning(){

  if(!userPoint){
    showToast('还没有获取到当前位置，请先允许定位');
    doGeolocation(true);
    return;
  }

  var base=new BMapGL.Point(userPoint.lng,userPoint.lat);

  showToast('正在为你规划~');

  var keywords=getRecommendationKeywords();
  var radii=[3000,6000,10000,15000,20000];

  searchRecommendationRange(
    base,
    keywords,
    0,
    radii,
    0,
    [],
    {}
  );

}

    return {iconFile:'museum.svg',cls:'type-museum',label:'博物馆'};

  if(/科技馆|科学馆|科技/.test(text)){
    return {iconFile:'technology.svg',cls:'type-museum',label:'科技馆'};
  }
  if(/展览|美术馆/.test(text)){

  }
  if(/商场|购物|mall/i.test(text)){
    return {iconFile:'shoppingmall.svg',cls:'type-mall',label:'商场'};
  }
  if(/商店|便利店|门店/.test(text)){
    return {iconFile:'store.svg',cls:'type-mall',label:'商店'};
  }
  if(/餐|饭店|美食|甜品|蛋糕/.test(text)){
    return {iconFile:'restaurant.svg',cls:'type-food',label:'餐饮'};
  }
  if(/游乐|乐园|儿童活动/.test(text)){
    return {iconFile:'playcentre.svg',cls:'type-park',label:'游玩'};
  }

  /* POI名称不一定直接包含类别词，因此用用户选择的出行目的兜底。 */
  if(purpose==='吃饭') return {iconFile:'restaurant.svg',cls:'type-food',label:'餐饮'};
  if(purpose==='游玩') return {iconFile:'playcentre.svg',cls:'type-park',label:'游玩'};
  if(purpose==='户外') return {iconFile:'park.svg',cls:'type-park',label:'户外'};
  if(purpose==='购物') return {iconFile:'shoppingmall.svg',cls:'type-mall',label:'商场'};
  if(purpose==='就医') return {iconFile:'motherbabyroom.svg',cls:'type-museum',label:'就医'};
  if(purpose==='文化场馆') return {iconFile:'library.svg',cls:'type-museum',label:'文化场馆'};
  if(purpose==='运动健身') return {iconFile:'stadium.svg',cls:'type-park',label:'运动健身'};

  return {iconFile:'',cls:'type-park',label:''};
}


function buildRecommendations(
  pois,
  base
){

  recommendedPlaces=[];

  if(
    !pois ||
    pois.length===0
  ){

    showToast(
      '附近暂未检索到相关地点'
    );

    goPage(
      'page1'
    );

    return;

  }

  for(
    var i=0;
    i<pois.length;
    i++
  ){

    var poi=pois[i];

    var name=
      stripHtml(
        poi.title
      ) ||
      '亲子地点';

    var addr=
      stripHtml(
        poi.address
      ) ||
      currentAddrText;

    var dist=
      calcDistance(
        base,
        poi.point
      );

    /*
     * Demo评分。
     * 不影响真实路线。
     */

    var ageScore=
      selectedAge==='0-3'
      ? .92
      : selectedAge==='3-6'
      ? .88
      : .84;

    var purposeScore=
      .7+
      Math.random()*.3;

    var facilityScore=
      .6+
      Math.random()*.4;

    var distScore=
      Math.max(
        0,
        1-dist/3000
      );

    var strollerScore=
      .6+
      Math.random()*.4;

    var weatherScore=
      .8+
      Math.random()*.2;

    var total=
      ageScore*.30+
      purposeScore*.20+
      facilityScore*.20+
      distScore*.15+
      strollerScore*.10+
      weatherScore*.05;

    var stars=
      Math.max(
        1,
        Math.min(
          5,
          Math.round(total*5)
        )
      );

    var typeInfo=
      guessIconByCategory(
        name,
        poi.tags,
        selectedPurpose
      );

    var tags=[];

    if(strollerScore>.75){
      tags.push('推车友好');
    }

    if(facilityScore>.75){
      tags.push('亲子设施');
    }

    tags.push(
      dist<1000
      ?
      '步行'+
      Math.max(
        3,
        Math.round(
          dist/70
        )
      )+
      '分钟'
      :
      (
        dist/1000
      ).toFixed(1)+'km'
    );

    recommendedPlaces.push({

      name:name,
      address:addr,
      point:poi.point,
      dist:dist,
      stars:stars,
      totalScore:total,
      iconFile:typeInfo.iconFile,
      typeLabel:typeInfo.label || '',
      cls:typeInfo.cls,
      photoUrl:'',
      tags:tags,
      strollerScore:strollerScore,

      scoreDetail:
        '年龄适配'+
        Math.round(ageScore*100)+
        '% · 出行目的'+
        Math.round(purposeScore*100)+
        '% · 亲子设施'+
        Math.round(facilityScore*100)+
        '% · 距离'+
        Math.round(distScore*100)+
        '% · 推车适配'+
        Math.round(strollerScore*100)+'%'

    });

  }

  recommendedPlaces.sort(
    function(a,b){
      return b.totalScore-
        a.totalScore;
    }
  );

  renderRecommendCards();

  goPage(
    'page3'
  );

  /* 百度POI图片为可选能力：有图片就展示，没有就保留本地SVG图标。 */
  loadRecommendationPhotos();

}

var BAIDU_AK='o8LnSUIDI7AiJDfc9eRMNz3YDSdKHkRn';
var baiduPhotoCallbackIndex=0;

function loadRecommendationPhotos(){

  for(
    var i=0;
    i<recommendedPlaces.length;
    i++
  ){
    queryBaiduPoiPhoto(
      recommendedPlaces[i],
      i

  }

function queryBaiduPoiPhoto(place,index){

  if(!place || !place.point){
    return;
  }

  var callbackName=
    'baiduPhotoCallback_'+
    (baiduPhotoCallbackIndex++);

  var script=document.createElement('script');
  var lat=place.point.lat;
  var lng=place.point.lng;

  window[callbackName]=function(data){

    try{
      var pois=(data && data.results)||[];
      var photo='';

      for(var i=0;i<pois.length;i++){
        var photos=pois[i].photos||[];
        if(photos.length && photos[0] && photos[0].url){
          photo=photos[0].url;
          break;
        }
      }

      if(photo){
        place.photoUrl=photo;
        applyRecommendationPhoto(index,photo);
      }
    }catch(e){}

    cleanup();
  };

  function cleanup(){
    try{
      delete window[callbackName];
      if(script.parentNode){
        script.parentNode.removeChild(script);
      }
    }catch(e){}
  }

  script.onerror=function(){
    cleanup();
  };

  var query=encodeURIComponent(place.name||'');
  script.src=
    'https://api.map.baidu.com/place/v2/search?'+
    'query='+query+
    '&location='+lat+','+lng+
    '&radius=200'+
    '&scope=2'+
    '&page_size=5'+
    '&photo_show=true'+
    '&output=json'+
    '&ak='+encodeURIComponent(BAIDU_AK)+
    '&callback='+callbackName;

  document.head.appendChild(script);

}

function applyRecommendationPhoto(index,url){

  var box=document.querySelector(
    '.rec-card:nth-child('+(index+1)+') .img-wrap'
  );

  if(!box || !url){
    return;
  }

  var fallback=box.querySelector('.place-photo.fallback');
  var oldPhoto=box.querySelector('.place-photo.remote');

  if(oldPhoto){
    oldPhoto.src=url;
    return;
  }

  var img=document.createElement('img');
  img.className='place-photo remote';
  img.alt='';
  img.setAttribute('aria-hidden','true');
  img.src=url;

  img.onload=function(){
    if(fallback){
      fallback.style.display='none';
    }
    box.insertBefore(img,box.querySelector('.photo-shade'));
    var shade=box.querySelector('.photo-shade');
    if(shade){
      shade.style.display='block';
    }
  };

  img.onerror=function(){
    try{ img.remove(); }catch(e){}
  };
}

/*
 * 尝试从百度路线结果提取真实路线点。
 */

function getRoutePathFromResult(
  res
){

  try{

    var plan=
      res.getPlan(0);

    if(!plan){
      return null;
    }

    var points=[];

    if(
      plan.getNumRoutes &&
      plan.getRoute
    ){

      var routeCount=
        plan.getNumRoutes();

      for(
        var r=0;
        r<routeCount;
        r++
      ){

        var route=
          plan.getRoute(r);

        if(
          route &&
          route.getPath
        ){

          var path=
            route.getPath();

          if(
            path &&
            path.length
          ){

            points=
              points.concat(
                path
              );

          }

        }

      }

    }


    /*
     * 部分版本使用 getSteps。
     */

    if(
      points.length<2 &&
      plan.getRoute
    ){

      var route=
        plan.getRoute(0);

      if(
        route &&
        route.getPath
      ){

        points=
          route.getPath() ||
          [];

      }

    }

    if(
      points.length>=2
    ){

      return points;

    }

  }catch(e){

    console.warn(
      '读取路线坐标失败',
      e
    );

  }

  return null;

}

/* =========================================================
   距离时间
========================================================= */

function formatDistanceTime(
  plan
){

  var distText='--';
  var timeText='--';

  try{

    if(
      plan &&
      plan.getDistance
    ){

      var d=
        plan.getDistance(
          false
        );

      distText=
        d<1000
        ? Math.round(d)+'米'
        :
        (d/1000).toFixed(1)+'公里';

    }

  }catch(e){}


  try{

    if(
      plan &&
      plan.getDuration
    ){

      var sec=
        plan.getDuration(
          false
        );

      var mins=
        Math.max(
          1,
          Math.round(sec/60)
        );

      timeText=
        mins<60
        ? mins+'分钟'
        :
        Math.floor(mins/60)+
        '小时'+
        (mins%60)+
        '分钟';

    }

  }catch(e){}

  return {
    dist:distText,
    time:timeText
  };

}

   停车场
========================================================= */

function searchNearbyParking(){

  if(!endPoint){
    return;
  }

  try{

    var local=
      new BMapGL.LocalSearch(
        map2,
        {

          renderOptions:{
            map:null,
            autoViewport:false
          },

          onSearchComplete:
            function(results){

              for(
                var i=0;
                i<parkingMarkers.length;
                i++
              ){

                try{
                  map2.removeOverlay(
                    parkingMarkers[i]
                  );
                }catch(e){}

              }

              parkingMarkers=[];

              var names=[];

              if(
                results &&
                results.getNumPois &&
                results.getNumPois()>0
              ){

                var n=
                  Math.min(
                    results.getNumPois(),
                    3
                  );

                for(
                  var i=0;
                  i<n;
                  i++
                ){

                  var poi=
                    results.getPoi(i);

                  if(
                    !poi ||
                    !poi.point
                  ){
                    continue;
                  }

                  names.push(
                    stripHtml(
                      poi.title
                    )
                  );

                  var marker=
                    new BMapGL.Label(
                      iconHtml('parking.svg','map-facility-icon','停车场'),
                      {
                        position:poi.point,
                        offset:
                          new BMapGL.Size(
                            -9,
                            -15
                          )
                      }
                    );

                  marker.setStyle({

                    background:'#fff',
                    color:'#555',
                    border:'1px solid #DCEEFF',
                    borderRadius:'12px',
                    padding:'3px 6px',
                    fontSize:'12px',
                    boxShadow:
                      '0 2px 6px rgba(0,0,0,.15)'

                  });

                  map2.addOverlay(
                    marker
                  );

                  parkingMarkers.push(
                    marker
                  );

                }

              }

              document.getElementById(
                'parkingLine'
              ).textContent=
                names.length
                ?
                '附近停车场：'+
                names.join('、')
                :
                '附近暂未检索到停车场信息';

            }

        }
      );

    local.searchNearby(
      '停车场',
      endPoint,
      1000
    );

  }catch(e){}

}


/* =========================================================
   页面4真实路线
========================================================= */

function planRoute(
  mode
){

  if(
    !startPoint ||
    !endPoint
  ){
    return;
  }

  clearMap2();

  addEndpointMarkers();

  fitViewport();

  try{

    var routeOptions={
      renderOptions:{
        map:null,
        autoViewport:false
      },

      onSearchComplete:
        function(res){

          if(
            !res ||
            typeof res.getPlan!=='function'
          ){

            showToast(
              '路线规划失败'
            );

            return;

          }

          var plan=
            res.getPlan(0);

          /*
           * 真实路线坐标
           */
          var path=
            getRoutePathFromResult(
              res
            );

          if(path){

            drawDashedRoute(
              map2,
              path
            );

          }

          /*
           * 如果 SDK 当前版本无法拿到 path，
           * 至少保持起终点和真实路线服务结果。
           */

          fitViewport();

          renderReasonCard(
            mode,
            formatDistanceTime(
              plan
            ),
            mode==='driving'
          );

          if(mode==='driving'){

            searchNearbyParking();

          }

        }

    };


    if(mode==='walking'){

      var walking=
        new BMapGL.WalkingRoute(
          map2,
          routeOptions
        );

      walking.search(
        startPoint,
        endPoint
      );

    }

    else if(mode==='driving'){

      var driving=
        new BMapGL.DrivingRoute(
          map2,
          routeOptions
        );

      driving.search(
        startPoint,
        endPoint
      );

    }

    else if(mode==='riding'){

      var riding=
        new BMapGL.RidingRoute(
          map2,
          routeOptions
        );

      riding.search(
        startPoint,
        endPoint
      );

    }

    else{

      var transit=
        new BMapGL.TransitRoute(
          map2,
          routeOptions
        );

      transit.search(
        startPoint,
        endPoint
      );

    }

  }catch(e){

    console.error(
      '路线规划错误',
      e
    );

    showToast(
      '路线规划出现问题'
    );

  }

}

function initMap3AndNav(){

  try{

    isNavPage=true;

    if(!map3){

      map3=
        new BMapGL.Map(
          'map3'
        );

      map3.enableScrollWheelZoom(
        true
      );

      if(
        map3.enablePinchToZoom
      ){

        map3.enablePinchToZoom();

      }

    }

    map3.resize();

    var navCenter=
      userPoint ||
      startPoint;

    if(!navCenter){

      showToast(
        '正在获取当前位置...'
      );

      startNavWatch();

      return;

    }

    map3.centerAndZoom(
      navCenter,
      17
    );

    map3.clearOverlays();

    facilityMarkers=[];
    facilityData=[];

    navSteps=[];
    navStepIndex=0;

    navUserMarker=null;

    /*
     * 默认所有设施显示
     */
    activeFacilityTypes={};

    for(
      var i=0;
      i<FACILITY_CATEGORY_MAP.length;
      i++
    ){

      activeFacilityTypes[
        FACILITY_CATEGORY_MAP[i].label
      ]=true;

    }

    /*
     * 分类卡片恢复“全部”
     */

    resetNavCategoryActive();

    /*
     * 绘制路线
     */

    if(
      startPoint &&
      endPoint
    ){

      drawNavRoute();

    }

    /*
     * 实时定位
     */

    doNavGeolocationNow();

    startNavWatch();

    setTimeout(
      function(){

        if(map3){
          map3.resize();
        }

      },
      300
    );

  }catch(e){

    console.error(
      '导航地图初始化失败',
      e
    );

  }

}


/* =========================================================
   分类卡片
========================================================= */

function resetNavCategoryActive(){

  var nodes=
    document.querySelectorAll(
      '#navCategoryScroll .nav-category'
    );

  for(
    var i=0;
    i<nodes.length;
    i++
  ){

    nodes[i].classList.remove(
      'active'
    );

  }

  if(nodes[0]){
    nodes[0].classList.add(
      'active'
    );
  }

}


function selectNavCategory(
  el,
  label
){

  var nodes=
    document.querySelectorAll(
      '#navCategoryScroll .nav-category'
    );

  for(
    var i=0;
    i<nodes.length;
    i++
  ){

    nodes[i].classList.remove(
      'active'
    );

  }

  el.classList.add(
    'active'
  );


  /*
   * 全部
   */

  if(label==='全部'){

    for(
      var k in activeFacilityTypes
    ){

      activeFacilityTypes[k]=true;

    }

  }

  /*
   * 单一分类
   */

  else{

    for(
      var k2 in activeFacilityTypes
    ){

      /*
       * “儿童乐园”等页面分类
       * 与设施真实分类保持对应。
       */

      activeFacilityTypes[k2]=
        false;

    }

    activeFacilityTypes[label]=
      true;

  }

  renderFacilityMarkers();

}


/* =========================================================
   导航实时定位
========================================================= */

function doNavGeolocationNow(){

  if(!navigator.geolocation){

    showToast(
      '当前浏览器不支持实时定位'
    );

    return;

  }

  try{

    navigator.geolocation.getCurrentPosition(

      function(position){

        updateNavUserPositionFromBrowser(
          position
        );

      },

      function(error){

        console.warn(
          '导航定位失败',
          error
        );

      },

      {
        enableHighAccuracy:true,
        timeout:10000,
        maximumAge:1000
      }

    );

  }catch(e){}

}


function startNavWatch(){

  if(navWatchId!==null){
    return;
  }

  if(!navigator.geolocation){
    return;
  }

  try{

    navWatchId=
      navigator.geolocation.watchPosition(

        function(position){

          updateNavUserPositionFromBrowser(
            position
          );

        },

        function(error){

          console.warn(
            '导航实时定位失败',
            error
          );

        },

        {
          enableHighAccuracy:true,
          timeout:15000,
          maximumAge:2000
        }

      );

  }catch(e){

    console.error(e);

  }

}


function stopNavLocationWatch(){

  if(
    navWatchId!==null &&
    navigator.geolocation
  ){

    try{

      navigator.geolocation.clearWatch(
        navWatchId
      );

    }catch(e){}

  }

  navWatchId=null;

}


function updateNavUserPositionFromBrowser(
  position
){

  if(
    !position ||
    !position.coords
  ){
    return;
  }

  var lat=
    position.coords.latitude;

  var lng=
    position.coords.longitude;

  if(
    typeof lat!=='number' ||
    typeof lng!=='number'
  ){
    return;
  }

  var pt=
    new BMapGL.Point(
      lng,
      lat
    );

  updateNavUserPosition(
    pt
  );

}


/* =========================================================
   导航当前位置
========================================================= */

function updateNavUserPosition(
  pt
){

  if(
    !pt ||
    !map3
  ){
    return;
  }

  userPoint=pt;

  /*
   * 更新顶部一行路线指导
   */

  updateLiveNavigationGuide(
    pt
  );


  /*
   * 地图只显示圆形当前位置，
   * 不直接显示文字。
   */

  if(navUserMarker){

    try{

      map3.removeOverlay(
        navUserMarker
      );

    }catch(e){}

  }

  navUserMarker=
    createMapPointMarker(
      pt,
      'user',
      '我的位置',
      map3
    );

  map3.addOverlay(
    navUserMarker
  );


  /*
   * 地图跟随
   */

  try{

    var center=
      map3.getCenter();

    var centerDist=
      map3.getDistance(
        center,
        pt
      );

    if(
      !center ||
      centerDist>250
    ){

      map3.panTo(
        pt
      );

    }

  }catch(e){

    try{
      map3.panTo(pt);
    }catch(err){}

  }

}


/* =========================================================
   一行实时路线指导
========================================================= */

function updateLiveNavigationGuide(
  currentPoint
){

  var textEl=
    document.getElementById(
      'stepMainText'
    );

  var iconEl=
    document.getElementById(
      'stepIcon'
    );

  if(
    !textEl ||
    !currentPoint
  ){
    return;
  }


  /*
   * 优先使用当前路线步骤。
   */

  if(
    navSteps &&
    navSteps.length
  ){

    var currentStep=
      navSteps[
        Math.min(
          navStepIndex,
          navSteps.length-1
        )
      ];

    if(currentStep){

      textEl.textContent=
        truncateStepText(
          currentStep,
          30
        );

      iconEl.textContent=
        getDirectionIcon(
          currentStep
        );

      return;

    }

  }


  /*
   * 如果没有详细步骤，
   * 使用当前位置到终点的距离。
   */

  if(endPoint){

    try{

      var dist=
        map3.getDistance(
          currentPoint,
          endPoint
        );

      var distText=
        dist<1000
        ?
        Math.round(dist)+'米'
        :
        (dist/1000).toFixed(1)+'公里';

      if(dist<30){

        textEl.textContent=
          '已到达目的地';

        iconEl.textContent='';

      }else{

        textEl.textContent=
          '沿当前路线继续前进，距目的地'+
          distText;

        iconEl.textContent='';

      }

    }catch(e){}

  }

}


function getDirectionIcon(
  text
){

  if(!text){
    return '';
  }

  if(
    /左转|向左|左侧/.test(text)
  ){
    return '↰';
  }

  if(
    /右转|向右|右侧/.test(text)
  ){
    return '↱';
  }

  if(
    /掉头/.test(text)
  ){
    return '↩';
  }

  if(
    /到达|终点/.test(text)
  ){
    return '';
  }

  if(
    /直行|继续|前行/.test(text)
  ){
    return '';
  }

  return '';

}
