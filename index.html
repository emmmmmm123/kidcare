<html lang="zh-CN"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>遛娃地图 · 亲子出行助手</title>
  <link rel="stylesheet" href="./遛娃地图 · 亲子出行助手_files/style.css">
</head>
<body>

  <!-- ============ P1 个性化推荐首页 ============ -->
  <section id="page-home" class="page">
    <header class="topbar">
      <div class="topbar-left">
        <span class="city" id="city-name">广州</span>
        <span class="weather" id="weather-info">天气加载中…</span>
      </div>
      <div class="topbar-right">
        <div class="logo">🧒 遛娃地图</div>
      </div>
    </header>

    <div class="address-box">
      <div class="address-row">
        <input id="current-address" class="address-input" type="text" value="广州市天河区" placeholder="当前地址">
        <button id="locate-btn" class="icon-btn" title="定位">📍</button>
      </div>
      <ul id="suggest-list" class="suggest"></ul>
    </div>

    <div class="map-wrap">
      <div id="home-map"></div>
    </div>

    <div class="nlp-box">
      <input id="nlp-input" type="text" placeholder="说出你的需求，如：带3岁宝宝找个室内玩的地方…">
    </div>

    <div class="chip-group">
      <div class="chip-title">宝宝年龄</div>
      <div class="chips" id="age-chips">
        <button class="chip active" data-age="0-3">0-3岁</button>
        <button class="chip" data-age="3-6">3-6岁</button>
        <button class="chip" data-age="6-12">6-12岁</button>
      </div>
    </div>

    <div class="chip-group">
      <div class="chip-title">出行目的</div>
      <div class="chips" id="purpose-chips">
        <button class="chip active" data-purpose="吃饭">🍚 吃饭</button>
        <button class="chip" data-purpose="游玩">🎡 游玩</button>
        <button class="chip" data-purpose="户外">🌳 户外</button>
        <button class="chip" data-purpose="购物">🛍️ 购物</button>
      </div>
    </div>

    <button id="plan-btn" class="primary-btn">开始规划 👉</button>
  </section>

  <!-- ============ P3 AI 推荐界面 ============ -->
  <section id="page-recommend" class="page" style="display:none">
    <header class="sub-topbar">
      <button class="back-btn" data-goto="page-home">←</button>
      <span class="sub-title">推荐结果</span>
      <span class="sub-right"></span>
    </header>

    <div class="ai-greeting">✨ 找到啦！这几个地方很适合你们~</div>

    <div id="recommend-list" class="recommend-list"></div>
  </section>

  <!-- ============ P4 路线规划 ============ -->
  <section id="page-route" class="page" style="display:none">
    <header class="sub-topbar">
      <button class="back-btn" data-goto="page-recommend">←</button>
      <span class="sub-title">路线规划</span>
      <span class="sub-right">🚻✨</span>
    </header>

    <div class="route-od">
      <div class="od-item">
        <span class="od-dot start"></span>
        <input id="route-start" class="od-input" type="text" value="当前位置">
      </div>
      <div class="od-item">
        <span class="od-dot dest"></span>
        <input id="route-end" class="od-input" type="text" placeholder="目的地">
      </div>
      <div class="od-actions">
        <button id="modify-start" class="mini-btn">修改起点</button>
        <button id="modify-dest" class="mini-btn">修改目的地</button>
      </div>
    </div>

    <div class="travel-tabs" id="travel-tabs">
      <button class="tab-tab active" data-mode="walking">🚶 步行</button>
      <button class="tab-tab" data-mode="driving">🚗 驾车</button>
      <button class="tab-tab" data-mode="transit">🚌 公共交通</button>
      <button class="tab-tab" data-mode="riding">🚲 骑行</button>
    </div>

    <div class="route-map-wrap">
      <div id="route-map"></div>
    </div>

    <div id="route-reason" class="route-reason"></div>

    <div id="route-info" class="route-info"></div>

    <button id="start-nav-btn" class="primary-btn">开始导航 🧭</button>
  </section>

  <!-- ============ P5 导航页面 ============ -->
  <section id="page-nav" class="page" style="display:none">
    <header class="sub-topbar nav-topbar">
      <button class="back-btn" data-goto="page-route">←</button>
      <span class="sub-title">导航中</span>
      <button id="facility-filter-btn" class="filter-btn">🏷️ 设施</button>
    </header>

    <div id="nav-step" class="nav-step"></div>

    <div class="nav-map-wrap">
      <div id="nav-map"></div>
    </div>

    <!-- 亲子设施筛选面板 -->
    <div id="facility-panel" class="facility-panel" style="display:none">
      <div class="facility-panel-title">亲子沿途设施</div>
      <div id="facility-list" class="facility-list"></div>
    </div>

    <div id="nav-ai-tip" class="nav-ai-tip">📣 AI 沿途提示：…</div>

    <button id="end-nav-btn" class="primary-btn danger">结束导航</button>
  </section>
